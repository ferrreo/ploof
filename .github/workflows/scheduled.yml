name: scheduled

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed SHA; empty uses workflow revision
        required: false
        type: string

permissions:
  contents: read

jobs:
  kernel-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: linux-6.1-intel
            runner: '["self-hosted","ploof-trusted","kernel-min-6.1.177","intel"]'
          - case: linux-6.1-amd
            runner: '["self-hosted","ploof-trusted","kernel-min-6.1.177","amd"]'
          - case: linux-6.6-intel
            runner: '["self-hosted","ploof-trusted","kernel-min-6.6.144","intel"]'
          - case: linux-6.12-amd
            runner: '["self-hosted","ploof-trusted","kernel-min-6.12.95","amd"]'
          - case: linux-6.18-intel
            runner: '["self-hosted","ploof-trusted","kernel-min-6.18.38","intel"]'
          - case: linux-7.1-intel
            runner: '["self-hosted","ploof-trusted","kernel-min-7.1.3","intel"]'
          - case: linux-7.1-amd
            runner: '["self-hosted","ploof-trusted","kernel-min-7.1.3","amd"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 360
    environment: trusted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate exact candidate before candidate tools
        env:
          CANDIDATE_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -eu
          printf '%s\n' "$CANDIDATE_REVISION" | \
            grep -Eq '^([0-9a-f]{40}|[0-9a-f]{64})$'
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$CANDIDATE_REVISION"
      - run: python3 tools/release.py check-host --case "${{ matrix.case }}"
      - run: >-
          python3 tools/release.py record
          --gate "scheduled.kernel-${{ matrix.case }}"
          --revision HEAD
          --output zig-out/evidence
          --artifact "zig-out/external/scheduled.kernel-${{ matrix.case }}.tar"
          -- tools/run-external-gate.sh "scheduled.kernel-${{ matrix.case }}"
          "zig-out/external/scheduled.kernel-${{ matrix.case }}.tar"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-${{ matrix.case }}-${{ github.run_id }}
          path: zig-out/evidence
          if-no-files-found: error

  campaigns:
    strategy:
      fail-fast: false
      matrix:
        gate:
          - scheduled.security-fuzz
          - scheduled.resource-plateau
          - scheduled.runtime-benchmarks
          - scheduled.deployment-direct
          - scheduled.deployment-caddy
          - scheduled.deployment-nginx
          - release.fuzz-budget
    runs-on: [self-hosted, linux, x64, ploof-trusted]
    timeout-minutes: 1500
    environment: trusted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate exact candidate before candidate tools
        env:
          CANDIDATE_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -eu
          printf '%s\n' "$CANDIDATE_REVISION" | \
            grep -Eq '^([0-9a-f]{40}|[0-9a-f]{64})$'
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$CANDIDATE_REVISION"
      - run: >-
          python3 tools/release.py record
          --gate "${{ matrix.gate }}"
          --revision HEAD
          --output zig-out/evidence
          --artifact "zig-out/external/${{ matrix.gate }}.tar"
          -- tools/run-external-gate.sh "${{ matrix.gate }}"
          "zig-out/external/${{ matrix.gate }}.tar"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.gate }}-${{ github.run_id }}
          path: zig-out/evidence
          if-no-files-found: error

  soaks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: linux-6.1-intel
            gate: release.soak-floor
            runner: '["self-hosted","ploof-trusted","kernel-min-6.1.177","intel"]'
          - case: linux-7.1-amd
            gate: release.soak-current
            runner: '["self-hosted","ploof-trusted","kernel-min-7.1.3","amd"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 1500
    environment: trusted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate exact candidate before candidate tools
        env:
          CANDIDATE_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -eu
          printf '%s\n' "$CANDIDATE_REVISION" | \
            grep -Eq '^([0-9a-f]{40}|[0-9a-f]{64})$'
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$CANDIDATE_REVISION"
      - run: python3 tools/release.py check-host --case "${{ matrix.case }}"
      - run: >-
          python3 tools/release.py record
          --gate "${{ matrix.gate }}"
          --revision HEAD
          --output zig-out/evidence
          --artifact "zig-out/external/${{ matrix.gate }}.tar"
          -- tools/run-external-gate.sh "${{ matrix.gate }}"
          "zig-out/external/${{ matrix.gate }}.tar"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.gate }}-${{ github.run_id }}
          path: zig-out/evidence
          if-no-files-found: error
